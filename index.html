<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Craig Young Music — Client Preview</title>
<link rel="icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#141c2e; --navy-2:#1e2942; --ink:#1a2238; --muted:#6a7385;
    --line:#e7e9f0; --line-soft:#f0f1f6; --bg:#f6f7fb; --card:#fff;
    --gold:#b8935a; --gold-2:#caa76b;
    --done:#1f9d6b; --done-bg:#e7f6ef; --await:#b8935a; --await-bg:#f7efe1;
    --alert:#c0492f; --alert-bg:#fbe9e5; --lock:#c2c8d4; --lock-bg:#eef0f5;
    --shadow:0 1px 2px rgba(24,33,53,.04), 0 8px 24px rgba(24,33,53,.06);
    --topbar-h:72px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Login */
  .login-wrap{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,#0e1626 100%);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
  .login-card{background:#fff;border-radius:18px;padding:38px 34px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
  .login-card img{height:74px;margin-bottom:8px}
  .login-card .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
  .login-card input{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;text-align:center}
  .login-card button{width:100%;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;border:none;padding:12px;border-radius:10px}
  .login-card button:hover{background:var(--navy-2)}
  .login-err{color:var(--alert);font-size:13px;margin-bottom:10px;min-height:18px}
  .login-hint{font-size:11.5px;color:var(--muted);margin-top:16px}

  .app{display:none}
  .topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:40;border-bottom:1px solid rgba(255,255,255,.06)}
  .tb-logo{height:52px;width:auto;display:block}
  .tb-left{display:flex;align-items:center;gap:12px}
  .nav-toggle{font-size:18px;line-height:1;cursor:pointer;color:#aeb6c9;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:6px 11px;font-family:inherit}
  .nav-toggle:hover{color:#fff;border-color:rgba(255,255,255,.35)}
  .tb-right{display:flex;align-items:center;gap:14px}
  .role-badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:20px}
  .role-badge.admin{color:#0e1626;background:var(--gold-2)}
  .role-badge.client{color:var(--gold-2);background:rgba(184,147,90,.16)}
  .logout-btn{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:#aeb6c9;background:transparent;border:1px solid rgba(255,255,255,.18);padding:7px 13px;border-radius:9px}
  .logout-btn:hover{color:#fff;border-color:rgba(255,255,255,.35)}

  .shell{display:flex;padding-top:var(--topbar-h);min-height:100%}
  .sidebar{width:262px;flex:0 0 262px;background:#fff;border-right:1px solid var(--line);position:fixed;top:var(--topbar-h);bottom:0;left:0;overflow-y:auto;padding:22px 0}
  .side-context{padding:0 20px 18px;margin-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .side-prepared{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .side-client{font-size:15px;font-weight:600;color:var(--ink)}
  .side-proj{font-family:'Fraunces',serif;font-size:15px;color:var(--gold);margin-top:2px}
  .nav-sec-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#a6adbd;font-weight:600;padding:14px 15px 6px}
  nav{padding:2px 12px 0}
  .nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:none;border:none;cursor:pointer;padding:9px 12px;border-radius:9px;border-left:3px solid transparent;margin-bottom:2px}
  .nav-item:hover{background:var(--bg)}
  .nav-item.sub{font-size:12.5px;color:var(--muted);padding-left:26px}
  .nav-item.active{background:var(--bg);border-left-color:var(--gold);color:var(--navy);font-weight:600}
  .nav-item .n-count{margin-left:auto;font-size:11px;color:var(--muted)}
  .side-progress{margin:16px 20px 0;padding:14px;background:var(--bg);border-radius:11px;font-size:12.5px;color:var(--muted)}
  .side-progress b{color:var(--ink);font-weight:600}
  .prog-track{height:6px;background:#e3e6ef;border-radius:4px;margin-top:9px;overflow:hidden}
  .prog-fill{height:100%;background:var(--done);width:0;transition:width .3s}

  .main{margin-left:262px;flex:1;padding:26px 30px 110px;max-width:1000px}
  .intro-band{background:linear-gradient(180deg,#fff 0%,#f9fafd 100%);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
  .ib-title{font-family:'Fraunces',serif;font-size:27px;font-weight:600;color:var(--navy);margin-bottom:6px}
  .ib-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
  .ib-intro{font-size:14px;color:var(--ink);max-width:640px}
  .admin-hint{margin-top:12px;font-size:12.5px;color:var(--gold);background:var(--await-bg);border-radius:9px;padding:9px 12px;display:inline-block}

  .pipe-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 16px;margin-bottom:22px;font-size:12px;color:var(--muted)}
  .pipe-legend .flow{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
  .pipe-legend .arrow{color:var(--lock)}
  .pipe-legend .keys{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
  .pipe-legend .keys span{display:inline-flex;align-items:center;gap:6px}
  .kdot{width:9px;height:9px;border-radius:50%}
  .kdot.done{background:var(--done)} .kdot.await{background:var(--await)} .kdot.lock{background:var(--lock)} .kdot.alert{background:var(--alert)}

  .category{margin-bottom:30px}
  .cat-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}
  .cat-name{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--navy)}
  .cat-sub{font-size:12.5px;color:var(--muted);font-style:italic}
  .cat-count{margin-left:auto;font-size:12px;color:var(--muted)}
  .subcat{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:16px 4px 8px}

  .list{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
  .track{border-bottom:1px solid var(--line-soft)}
  .track:last-child{border-bottom:none}
  .row{display:flex;align-items:center;gap:16px;padding:13px 16px;cursor:pointer}
  .row:hover{background:#fbfbfd}
  .track.complete .row{background:var(--done-bg)}
  .r-main{flex:1;min-width:0}
  .r-title{font-size:14.5px;font-weight:600;color:var(--ink)}
  .r-status{font-size:12px;margin-top:3px;font-weight:500}
  .r-status.done{color:var(--done)} .r-status.await{color:var(--await)} .r-status.alert{color:var(--alert)} .r-status.neutral{color:var(--muted)}

  .tracker{display:flex;align-items:flex-start;gap:0}
  .step{display:flex;flex-direction:column;align-items:center;width:66px;position:relative}
  .step .sdot{width:16px;height:16px;border-radius:50%;background:var(--lock-bg);border:2px solid var(--lock);z-index:2;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700}
  .step.done .sdot{background:var(--done);border-color:var(--done)}
  .step.await .sdot{background:var(--await);border-color:var(--await)}
  .step.alert .sdot{background:var(--alert);border-color:var(--alert)}
  .step .slabel{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;font-weight:500}
  .step.done .slabel,.step.await .slabel{color:var(--ink)}
  .step::before{content:"";position:absolute;top:7px;left:-33px;width:66px;height:2px;background:var(--lock);z-index:1}
  .step:first-child::before{display:none}
  .step.on-line::before{background:var(--done)}
  .chev{color:var(--muted);font-size:13px;transition:transform .2s;flex:0 0 auto}
  .track.open .chev{transform:rotate(90deg)}

  .expand{display:none;padding:4px 16px 18px;background:#fcfcfe}
  .track.open .expand{display:block}
  .stage{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-top:10px}
  .stage-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .stage-num{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .stage-name{font-size:13.5px;font-weight:600;color:var(--ink)}
  .stage-info{font-size:11px;color:var(--muted);cursor:help;font-weight:400}
  .piece-desc{font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;margin-top:10px}
  .piece-desc .pd-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
  /* Approve & Pay */
  .pay-block{margin-top:12px;padding:14px 16px;border:1px solid var(--gold);border-radius:11px;background:#fffdf9}
  .pay-block .pay-lbl{font-size:12.5px;color:var(--ink);margin-bottom:9px}
  .pay-block .pay-lbl b{color:var(--navy)}
  .pay-btn{display:inline-block;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--gold);color:#fff;border:none;padding:11px 22px;border-radius:10px;text-decoration:none}
  .pay-btn:hover{background:var(--gold-2)}
  .pay-btn.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
  .pay-note{font-size:11.5px;color:var(--muted);margin-top:8px}
  /* Music samples */
  .sample{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
  .sample.chosen{border-color:var(--done);background:var(--done-bg)}
  .sample-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);flex-wrap:wrap}
  .sample-rec{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:var(--await-bg);padding:2px 8px;border-radius:20px}
  .choose-btn{font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--done);background:#fff;color:var(--done);padding:6px 12px;border-radius:8px;margin-top:6px}
  .choose-btn.on{background:var(--done);color:#fff}
  .choose-btn:disabled{opacity:.5;cursor:default}
  /* Final metadata + dual approve */
  .dual-approve{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .meta-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .meta-form input{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
  .meta-form .full{grid-column:1 / -1}
  .meta-view{font-size:12.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;margin-top:8px}
  .stage-chip{margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
  .stage-chip.done{color:var(--done);background:var(--done-bg)}
  .stage-chip.await{color:var(--await);background:var(--await-bg)}
  .stage-chip.alert{color:var(--alert);background:var(--alert-bg)}
  .stage-chip.lock{color:var(--muted);background:var(--lock-bg)}
  .stage-body{font-size:12.5px;color:var(--muted);margin-top:6px}
  .rerecord-banner{background:var(--alert-bg);color:var(--alert);font-size:12.5px;font-weight:500;border-radius:9px;padding:9px 12px;margin-top:6px}
  audio{width:100%;height:38px;margin-top:8px}
  .no-audio{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:9px 12px;margin-top:8px}
  .stage-actions{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .approve-btn{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--done);background:#fff;color:var(--done);padding:7px 14px;border-radius:8px}
  .approve-btn.on{background:var(--done);color:#fff}
  .approve-btn:disabled{opacity:.45;cursor:not-allowed}
  .note-box[readonly]{background:var(--line-soft);cursor:not-allowed}
  .note-toggle{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}
  .note-box{width:100%;margin-top:8px;font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px;resize:vertical;min-height:40px;display:none}
  .note-box.open{display:block}
  .client-note-view{margin-top:8px;font-size:12.5px;color:var(--ink);background:var(--await-bg);border-radius:9px;padding:8px 11px}

  /* Admin controls */
  .admin-box{margin-top:10px;padding:11px 12px;border:1px dashed var(--gold);border-radius:10px;background:#fffdf9}
  .admin-box .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
  .admin-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .admin-row input[type=file]{font-family:inherit;font-size:12px;max-width:230px}
  .mini-btn{font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:6px 12px;border-radius:8px}
  .mini-btn.ghost{background:#fff;color:var(--navy)}
  .mini-btn:disabled{opacity:.5;cursor:default}
  .admin-row select{font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
  .toggle-lbl{font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .uling{font-size:11.5px;color:var(--muted)}

  /* Admin content editor */
  .admin-add{margin:10px 4px 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .add-btn{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--navy);background:#fff;border:1px dashed var(--gold);padding:7px 13px;border-radius:9px}
  .add-btn:hover{background:#fffdf9}
  .add-form{margin:8px 4px 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fffdf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .add-form input,.add-form select{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
  .add-form input.title{min-width:200px}
  .cat-add-btn{font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--gold);background:none;border:none;text-decoration:underline;margin-left:10px}
  .details-box{margin-top:10px;padding:12px;border:1px dashed var(--gold);border-radius:10px;background:#fffdf9}
  .details-box .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
  .details-grid{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .details-grid input,.details-grid select{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
  .details-grid input.title{min-width:220px}
  .danger-btn{font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--alert);background:#fff;border:1px solid var(--alert);padding:6px 12px;border-radius:8px}
  .upload-box{margin-top:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfbfd}
  .upload-box .ulbl{font-size:11.5px;font-weight:600;color:var(--ink);margin-bottom:8px}

  .bar{position:fixed;bottom:0;left:262px;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(24,33,53,.06);padding:12px 30px;z-index:30}
  .bar-inner{display:flex;align-items:center;gap:16px;max-width:1000px}
  .bar-stat{font-size:13.5px;color:var(--muted);font-weight:500}
  .bar-stat b{color:var(--ink)}
  .copy-btn{margin-left:auto;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;border:none;padding:11px 20px;border-radius:10px}
  .copy-btn:hover{background:var(--navy-2)}
  .copy-btn.done{background:var(--done)}

  /* View-as-client toggle + preview banner */
  .view-toggle{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:#0e1626;background:var(--gold-2);border:none;padding:7px 13px;border-radius:9px}
  .view-toggle:hover{background:var(--gold);color:#fff}
  .view-toggle.previewing{background:transparent;color:#aeb6c9;border:1px solid rgba(255,255,255,.28)}
  .preview-banner{position:fixed;top:var(--topbar-h);left:0;right:0;z-index:35;background:var(--gold-2);color:#0e1626;font-size:12.5px;font-weight:600;text-align:center;padding:7px 14px;display:none}
  body.previewing .preview-banner{display:block}
  body.previewing .sidebar{top:calc(var(--topbar-h) + 33px)}
  body.previewing .main{padding-top:59px}

  /* Artwork stage */
  .cover-img{width:100%;max-width:300px;border-radius:11px;margin-top:8px;display:block;border:1px solid var(--line)}
  .no-cover{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:9px 12px;margin-top:8px}

  /* Admin dashboard */
  .dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:22px}
  .dash-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow)}
  .dash-card .dc-num{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--navy);line-height:1}
  .dash-card .dc-lbl{font-size:12px;color:var(--muted);margin-top:6px}
  .dash-card.attn .dc-num{color:var(--await)}
  .dash-sec{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .dash-sec h3{font-family:'Fraunces',serif;font-size:18px;color:var(--navy);margin-bottom:4px;font-weight:600}
  .dash-sec .sec-note{font-size:12px;color:var(--muted);margin-bottom:12px}
  .dash-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .dash-item:last-child{border-bottom:none}
  .di-tag{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-top:1px}
  .di-tag.await{color:var(--await);background:var(--await-bg)} .di-tag.alert{color:var(--alert);background:var(--alert-bg)} .di-tag.note{color:var(--navy);background:var(--lock-bg)}
  .di-body{flex:1;min-width:0}
  .di-title{font-weight:600;color:var(--ink)}
  .di-sub{color:var(--muted);font-size:12px;margin-top:2px}
  .dash-empty{font-size:13px;color:var(--muted);padding:6px 0}
  .ph-badge{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--await-bg);padding:5px 11px;border-radius:20px}
  .acct-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .acct-form input{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;min-width:200px}
  .acct-msg{font-size:12.5px;margin-top:10px;min-height:16px}
  .acct-msg.err{color:var(--alert)} .acct-msg.ok{color:var(--done)}

  /* Collapsible sidebar */
  .sidebar{transition:transform .25s ease}
  .main{transition:margin-left .25s ease}
  .bar{transition:left .25s ease}
  body.nav-collapsed .sidebar{transform:translateX(-100%)}
  body.nav-collapsed .main{margin-left:0}
  body.nav-collapsed .bar{left:0}

  @media (max-width:860px){
    .sidebar{display:block;z-index:45;box-shadow:2px 0 24px rgba(0,0,0,.18)}
    .main{margin-left:0;padding:18px 14px 110px}.bar{left:0}
    .step{width:52px}.step::before{width:52px;left:-26px}.step .slabel{display:none}
  }
</style>
</head>
<body>
  <!-- Login -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <img id="loginLogo" src="cym-logo-gold-tp.png" alt="Craig Young Music" style="filter:brightness(.55)" />
      <div class="sub">Client Preview &amp; Approvals</div>
      <div class="login-err" id="loginErr"></div>
      <input id="loginCode" type="password" placeholder="Enter your access code" autocomplete="off" />
      <button id="loginBtn">Enter</button>
      <div class="login-hint">Your producer will have given you an access code.</div>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <div class="topbar">
      <div class="tb-left">
        <button class="nav-toggle" id="sideToggle" aria-label="Toggle menu" title="Show / hide menu">☰</button>
        <img class="tb-logo" id="logo" alt="Craig Young Music" />
      </div>
      <div class="tb-right">
        <button class="view-toggle" id="viewToggle" style="display:none">View as client</button>
        <span class="role-badge" id="roleBadge"></span>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>
    </div>
    <div class="preview-banner" id="previewBanner"></div>

    <div class="shell">
      <aside class="sidebar">
        <div class="side-context">
          <div class="side-prepared">Prepared for</div>
          <div class="side-client" id="sideClient"></div>
          <div class="side-proj" id="sideProj"></div>
        </div>
        <nav id="nav"></nav>
        <div class="side-progress" id="sideProgress"></div>
      </aside>

      <main class="main">
        <div class="intro-band">
          <div class="ib-title" id="ibTitle"></div>
          <div class="ib-sub" id="ibSub"></div>
          <div class="ib-intro" id="ibIntro"></div>
          <div class="admin-hint" id="adminHint" style="display:none">Admin mode — upload audio to any stage and toggle when it's ready for the client to review.</div>
        </div>
        <div class="pipe-legend">
          <div class="flow"><span title="Your raw recording is in. Craig confirms it's good to produce, or flags a re-record.">Vocal Received</span><span class="arrow">→</span><span title="Craig's cleaned, produced version of your vocal. Approve it or request a change.">Produced Vocal</span><span class="arrow">→</span><span title="Your vocal set to music — pick the option you love.">Music Samples</span><span class="arrow">→</span><span title="Your cover artwork — upload your own or approve the studio-created design.">Cover Art</span><span class="arrow">→</span><span title="The finished master. Approve it and complete your purchase.">Final</span></div>
          <div class="keys">
            <span><i class="kdot await"></i> Awaiting client</span>
            <span><i class="kdot done"></i> Approved</span>
            <span><i class="kdot lock"></i> In progress</span>
            <span><i class="kdot alert"></i> Re-record</span>
          </div>
        </div>
        <div id="categories"></div>
      </main>
    </div>

    <div class="bar">
      <div class="bar-inner">
        <div class="bar-stat" id="barStat"></div>
        <button class="copy-btn" id="copyBtn"></button>
      </div>
    </div>
  </div>

<script>
(function(){
  var D=null, ROLE=null, FILTER='__all__', openIds={}, PREVIEW=false;
  // effective view-role: admin can preview the client experience without logging out
  function vr(){ return PREVIEW ? 'client' : ROLE; }

  // ---- api helpers
  function api(method,url,body){
    return fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
      .then(function(r){ if(!r.ok) return r.json().then(function(j){throw j;}); return r.json(); });
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

  // ---- login
  var loginWrap=document.getElementById('loginWrap'),loginErr=document.getElementById('loginErr');
  function doLogin(){
    var code=document.getElementById('loginCode').value;
    api('POST','/api/login',{code:code}).then(function(){ boot(); })
      .catch(function(e){ loginErr.textContent=(e&&e.error)||'Login failed'; });
  }
  document.getElementById('loginBtn').addEventListener('click',doLogin);
  document.getElementById('loginCode').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('logoutBtn').addEventListener('click',function(){ api('POST','/api/logout').then(function(){ location.reload(); }); });

  function boot(){
    api('GET','/api/data').then(function(data){
      D=data; ROLE=data.role;
      loginWrap.style.display='none';
      document.getElementById('app').style.display='block';
      initChrome(); render(); refreshBar();
    }).catch(function(){ loginWrap.style.display='flex'; document.getElementById('app').style.display='none'; });
  }

  function initChrome(){
    var logo=document.getElementById('logo');
    if(D.brand.logoSrc) logo.src=D.brand.logoSrc; else logo.style.display='none';
    applyProjectChrome();
    var vt=document.getElementById('viewToggle');
    vt.onclick=function(){
      PREVIEW=!PREVIEW;
      if(PREVIEW && FILTER==='__dash__') FILTER='__all__';
      syncViewChrome(); render(); refreshBar();
      window.scrollTo({top:0,behavior:'smooth'});
    };
    var navOpen = window.innerWidth > 860;
    function applyNav(){ document.body.classList.toggle('nav-collapsed', !navOpen); }
    document.getElementById('sideToggle').onclick=function(){ navOpen=!navOpen; applyNav(); };
    applyNav();
    syncViewChrome();
  }
  // reads from D.project (the active/own project) — re-run after any project switch or edit
  function applyProjectChrome(){
    document.getElementById('sideClient').textContent=D.client.name;
    document.getElementById('sideProj').textContent=D.project.name;
    document.getElementById('ibTitle').textContent=D.project.name;
    document.getElementById('ibSub').textContent='Prepared for '+D.client.name+'  ·  produced by '+(D.project.preparedBy||'Craig Young');
    document.getElementById('ibIntro').textContent=D.project.intro||'';
    document.getElementById('copyBtn').textContent=(D.contact&&D.contact.label)?D.contact.label:'Copy my approvals';
    document.getElementById('copyBtn').style.display = vr()==='admin' ? 'none' : '';
    document.getElementById('previewBanner').textContent='Previewing as '+D.client.name+' — exactly what the client sees. Read-only: to actually approve or request a change, log in with the client code.';
  }
  function syncViewChrome(){
    var showRole=vr(), badge=document.getElementById('roleBadge');
    badge.className='role-badge '+(showRole==='admin'?'admin':'client');
    badge.textContent = showRole==='admin' ? 'Admin · '+(D.project.preparedBy||'Craig Young') : (PREVIEW?'Client view':'Client');
    document.getElementById('adminHint').style.display = showRole==='admin'?'inline-block':'none';
    var vt=document.getElementById('viewToggle');
    vt.style.display = ROLE==='admin' ? 'inline-block' : 'none';
    vt.textContent = PREVIEW ? 'Back to admin view' : 'View as client';
    vt.classList.toggle('previewing', PREVIEW);
    document.body.classList.toggle('previewing', PREVIEW);
  }

  // ---- model helpers
  function appr(id){ return D.approvals[id] || {}; }
  function eachCat(fn){ D.categories.forEach(fn); }
  function catTracks(cat){ return cat.subcategories?cat.subcategories.reduce(function(a,s){return a.concat(s.tracks);},[]):cat.tracks; }
  function allTracks(){ var out=[]; eachCat(function(cat){ if(cat.subcategories) cat.subcategories.forEach(function(s){ s.tracks.forEach(function(t){out.push({t:t,cat:cat.name,sub:s.name});}); }); else cat.tracks.forEach(function(t){out.push({t:t,cat:cat.name,sub:null});}); }); return out; }

  function steps(tr){
    var a=appr(tr.id);
    return {
      raw: tr.raw==='rerecord'?'alert':(tr.raw==='accepted'?'done':'neutral'),
      cleaned: !tr.cleaned?'lock':(a.cleanedApproved?'done':'await'),
      music: !tr.music?'lock':(a.musicSeen?'done':'await'),
      final: !tr.final?'lock':(a.finalApproved?'done':'await'),
      art: !tr.art?'lock':(a.artApproved?'done':'await')
    };
  }
  function statusLabel(tr){
    var a=appr(tr.id);
    if(tr.raw==='rerecord') return ['Re-record requested','alert'];
    if(tr.final && a.finalApproved) return ['Complete','done'];
    if(tr.final && !a.finalApproved) return ['Final ready for approval','await'];
    if(tr.cleaned && !a.cleanedApproved) return ['Vocal ready for approval','await'];
    if(tr.cleaned && a.cleanedApproved) return ['In production — music & final','neutral'];
    if(tr.raw==='accepted') return ['Approved — in production','neutral'];
    return ['Received','neutral'];
  }

  // ---- render
  var nav=document.getElementById('nav'), host=document.getElementById('categories');
  function render(){
    nav.innerHTML=''; host.innerHTML='';
    var isAdmin = vr()==='admin';
    var special = (SPECIAL[FILTER] && (isAdmin || FILTER==='__account__')) ? SPECIAL[FILTER] : null;
    if(isAdmin){
      addNavLabel('Workspace');
      addNav('Dashboard','__dash__',false);
      addNav('Production queue','__queue__',false);
      addNav('Approvals & notes','__approvals__',false);
      addNav('Deliverables','__deliverables__',false);
      addNavLabel('Catalogue');
      addNav('Overview','__all__',false);
    }else{
      addNavLabel('Collections');
      addNav('Overview','__all__',false);
    }
    if(special) special();
    D.categories.forEach(function(cat, ci){
      var sec=document.createElement('section');sec.className='category';
      if(special) sec.style.display='none';
      else if(FILTER!=='__all__' && FILTER.split('::')[0]!==cat.name) sec.style.display='none';
      var head=document.createElement('div');head.className='cat-head';
      head.innerHTML='<div class="cat-name">'+esc(cat.name)+'</div>'+(cat.subtitle?'<div class="cat-sub">'+esc(cat.subtitle)+'</div>':'')+'<div class="cat-count">'+catTracks(cat).length+' pieces</div>';
      if(vr()==='admin' && cat.subcategories){
        var asb=document.createElement('button');asb.className='cat-add-btn';asb.textContent='+ sacred text';
        asb.addEventListener('click',function(){
          if(sec.querySelector('.subadd-form')) return;
          var f=document.createElement('div');f.className='add-form subadd-form';
          f.innerHTML='<input class="title" placeholder="Sacred text / sub-collection name" /><button class="mini-btn" data-save>Add</button><button class="mini-btn ghost" data-cancel>Cancel</button>';
          head.insertAdjacentElement('afterend', f);
          var ni=f.querySelector('.title'); ni.focus();
          f.querySelector('[data-cancel]').addEventListener('click',function(){ f.remove(); });
          function sub(){ var n=ni.value.trim(); if(!n){ni.focus();return;} api('POST','/api/subcategory-add',{catIndex:ci,name:n}).then(reloadKeepOpen); }
          f.querySelector('[data-save]').addEventListener('click',sub);
          ni.addEventListener('keydown',function(e){ if(e.key==='Enter') sub(); });
        });
        head.querySelector('.cat-count').appendChild(asb);
      }
      sec.appendChild(head);
      if(cat.subcategories){
        cat.subcategories.forEach(function(sub, si){
          var showSub = FILTER==='__all__' || FILTER===cat.name || FILTER===cat.name+'::'+sub.name;
          var block=document.createElement('div'); if(!showSub) block.style.display='none';
          var lbl=document.createElement('div');lbl.className='subcat';lbl.textContent=sub.name+'  ·  '+sub.tracks.length+' pieces';
          block.appendChild(lbl);block.appendChild(listEl(sub.tracks));
          if(vr()==='admin') block.appendChild(addTrackControl(ci, si));
          sec.appendChild(block);
        });
      }else{
        sec.appendChild(listEl(cat.tracks));
        if(vr()==='admin') sec.appendChild(addTrackControl(ci, null));
      }
      host.appendChild(sec);
      addNav(cat.name,cat.name,false,catTracks(cat).length);
      if(cat.subcategories) cat.subcategories.forEach(function(sub){ addNav(sub.name,cat.name+'::'+sub.name,true,sub.tracks.length); });
    });
    if(isAdmin){
      addNavLabel('Manage');
      addNav('Clients','__clients__',false);
      addNav('Billing','__billing__',false);
      addNav('Settings','__settings__',false);
      addNav('Account & security','__account__',false);
    }else{
      addNavLabel('Account');
      addNav('Account & security','__account__',false);
    }
    if(!special && isAdmin) host.appendChild(addCollectionControl());
  }

  function addNavLabel(text){ var d=document.createElement('div');d.className='nav-sec-label';d.textContent=text;nav.appendChild(d); }

  // special (non-catalogue) views. Placeholders are the framework to build into.
  var SPECIAL = {
    '__dash__': renderDashboard,
    '__queue__': function(){ placeholder('Production queue','A pipeline view across every piece — what’s in raw, cleaning, music, final and artwork, and what’s next in line to produce.'); },
    '__approvals__': function(){ placeholder('Approvals & notes','Every client approval and change request in one running list, filterable by piece and stage.'); },
    '__deliverables__': function(){ placeholder('Deliverables','Final approved audio + covers, ready to hand off — download or export per collection.'); },
    '__clients__': renderClients,
    '__billing__': function(){ placeholder('Billing','Per-recording rates and founding rates, what’s been invoiced, and what’s paid.'); },
    '__settings__': renderSettings,
    '__account__': renderAccount
  };
  function placeholder(title,desc){
    var w=document.createElement('div');w.className='dash-sec';
    w.innerHTML='<h3>'+esc(title)+'</h3><div class="sec-note">'+esc(desc)+'</div><span class="ph-badge">Framework · in development</span>';
    host.appendChild(w);
  }
  function renderAccount(){
    var who = vr()==='admin' ? 'admin' : 'client';
    var w=document.createElement('div');w.className='dash-sec';
    w.innerHTML='<h3>Account &amp; security</h3>'
      +'<div class="sec-note">Change the '+who+' access code for this site. The code set on the server always works as a recovery fallback, so you can’t get locked out.</div>'
      +'<div class="acct-form"><input type="password" id="acCode1" placeholder="New access code (min 4 chars)" autocomplete="new-password" /><input type="password" id="acCode2" placeholder="Confirm new code" autocomplete="new-password" /><button class="mini-btn" id="acSave">Update code</button></div>'
      +'<div class="acct-msg" id="acMsg"></div>';
    host.appendChild(w);
    var i1=document.getElementById('acCode1'), i2=document.getElementById('acCode2'), btn=document.getElementById('acSave'), msg=document.getElementById('acMsg');
    if(PREVIEW){ i1.disabled=true;i2.disabled=true;btn.disabled=true;msg.textContent='Read-only in preview.'; return; }
    btn.addEventListener('click',function(){
      var c1=i1.value.trim(), c2=i2.value.trim();
      if(c1.length<4){ msg.className='acct-msg err'; msg.textContent='At least 4 characters.'; return; }
      if(c1!==c2){ msg.className='acct-msg err'; msg.textContent='Codes do not match.'; return; }
      api('POST','/api/change-code',{newCode:c1}).then(function(){ msg.className='acct-msg ok'; msg.textContent='Updated. Use the new code next time you log in.'; i1.value='';i2.value=''; })
        .catch(function(e){ msg.className='acct-msg err'; msg.textContent=(e&&e.error)||'Update failed.'; });
    });
  }

  // ---- Clients & projects (admin) ----
  function renderClients(){
    var wrap=document.createElement('div');
    var head=document.createElement('div');head.className='dash-sec';
    head.innerHTML='<h3>Clients &amp; projects</h3><div class="sec-note">Each project is its own client-facing preview — its own access code, catalogue and approvals. Open a project to make it active, or set its client code to hand out a link.</div>'
      +'<div class="acct-form"><input id="ncName" placeholder="New client name" /><button class="mini-btn" id="ncAdd">Add client</button></div><div class="acct-msg" id="ncMsg"></div>';
    wrap.appendChild(head);
    (D.clients||[]).forEach(function(c){
      var sec=document.createElement('div');sec.className='dash-sec';
      var h='<h3>'+esc(c.name)+'</h3>';
      if(c.projects.length){
        c.projects.forEach(function(p){
          var active=p.id===D.activeProjectId;
          h+='<div class="dash-item"><div class="di-body"><div class="di-title">'+esc(p.name)+(active?' <span class="di-tag note">active</span>':'')+'</div>'
            +'<div class="di-sub">'+p.pieces+' pieces · '+(p.hasCode?'client code set':'no client code yet')+'</div></div>'
            +'<button class="mini-btn ghost" data-open="'+esc(p.id)+'"'+(active?' disabled':'')+'>Open</button>'
            +'<button class="mini-btn ghost" data-code="'+esc(p.id)+'">Set code</button></div>';
        });
      } else h+='<div class="dash-empty">No projects yet.</div>';
      h+='<div class="acct-form"><input class="npName" placeholder="New project name" /><input class="npIntro" placeholder="Client intro (optional)" style="min-width:240px" /><button class="mini-btn" data-addproj="'+esc(c.id)+'">Add project</button></div>';
      sec.innerHTML=h; wrap.appendChild(sec);
    });
    host.appendChild(wrap);
    var ncMsg=document.getElementById('ncMsg');
    document.getElementById('ncAdd').addEventListener('click',function(){
      var n=document.getElementById('ncName').value.trim();
      if(!n){ ncMsg.className='acct-msg err'; ncMsg.textContent='Enter a client name.'; return; }
      api('POST','/api/client-add',{name:n}).then(reloadKeepOpen).catch(function(e){ ncMsg.className='acct-msg err'; ncMsg.textContent=(e&&e.error)||'Failed'; });
    });
    wrap.querySelectorAll('[data-addproj]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var row=btn.closest('.acct-form'), nm=row.querySelector('.npName').value.trim(), intro=row.querySelector('.npIntro').value.trim();
        if(!nm){ row.querySelector('.npName').focus(); return; }
        api('POST','/api/project-add',{clientId:btn.getAttribute('data-addproj'),name:nm,intro:intro}).then(function(){ FILTER='__all__'; return reloadKeepOpen(); });
      });
    });
    wrap.querySelectorAll('[data-open]').forEach(function(btn){
      btn.addEventListener('click',function(){ api('POST','/api/project-select',{projectId:btn.getAttribute('data-open')}).then(function(){ FILTER='__all__'; return reloadKeepOpen(); }); });
    });
    wrap.querySelectorAll('[data-code]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var code=window.prompt('Set the client access code for this project (min 4 characters):');
        if(code==null) return; code=code.trim();
        if(code.length<4){ alert('Code must be at least 4 characters.'); return; }
        api('POST','/api/project-set-code',{projectId:btn.getAttribute('data-code'),code:code}).then(reloadKeepOpen).catch(function(e){ alert((e&&e.error)||'Failed'); });
      });
    });
  }

  // ---- Project settings (admin) ----
  function renderSettings(){
    var w=document.createElement('div');w.className='dash-sec';
    w.innerHTML='<h3>Project settings</h3><div class="sec-note">Editing the active project — '+esc(D.project.name)+'. This is the header, intro and payment link the client sees.</div>'
      +'<div class="acct-form" style="flex-direction:column;align-items:stretch;max-width:560px">'
      +'<input id="stName" placeholder="Project name" value="'+esc(D.project.name)+'" />'
      +'<input id="stPrep" placeholder="Produced by" value="'+esc(D.project.preparedBy||'')+'" />'
      +'<textarea id="stIntro" placeholder="Client intro" style="font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;min-height:90px;resize:vertical">'+esc(D.project.intro||'')+'</textarea>'
      +'<div class="lbl" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:6px">Payment (Approve &amp; Pay button)</div>'
      +'<input id="stPayUrl" placeholder="Stripe payment link (https://buy.stripe.com/...)" value="'+esc(D.project.payUrl||'')+'" />'
      +'<input id="stPayLabel" placeholder="Price label shown to client (e.g. $400 USD · Preferred Client)" value="'+esc(D.project.payLabel||'')+'" />'
      +'<div><button class="mini-btn" id="stSave">Save settings</button></div>'
      +'</div><div class="acct-msg" id="stMsg"></div>';
    host.appendChild(w);
    document.getElementById('stSave').addEventListener('click',function(){
      var msg=document.getElementById('stMsg');
      var nameVal=document.getElementById('stName').value.trim(), introVal=document.getElementById('stIntro').value, prepVal=document.getElementById('stPrep').value.trim();
      var payUrlVal=document.getElementById('stPayUrl').value.trim(), payLabelVal=document.getElementById('stPayLabel').value.trim();
      api('POST','/api/project-update',{projectId:D.project.id,name:nameVal,intro:introVal,preparedBy:prepVal,payUrl:payUrlVal,payLabel:payLabelVal})
        .then(function(){ if(nameVal) D.project.name=nameVal; D.project.intro=introVal; D.project.preparedBy=prepVal; D.project.payUrl=payUrlVal; D.project.payLabel=payLabelVal; applyProjectChrome(); msg.className='acct-msg ok'; msg.textContent='Saved.'; })
        .catch(function(e){ msg.className='acct-msg err'; msg.textContent=(e&&e.error)||'Failed'; });
    });
  }

  // ---- admin dashboard (basic) ----
  function renderDashboard(){
    var tracks=allTracks();
    var total=tracks.length, finalApproved=0, coversApproved=0, awaitingClient=0, rawToAccept=0;
    var attention=[];
    tracks.forEach(function(x){
      var tr=x.t, a=appr(tr.id), loc=x.sub?x.cat+' / '+x.sub:x.cat;
      if(a.finalApproved) finalApproved++;
      if(a.artApproved) coversApproved++;
      if(tr.raw==='received'){ rawToAccept++; attention.push({tag:'To approve',cls:'await',title:tr.title,sub:loc+'  ·  raw recording is in — approve the quality to send it into production'}); }
      if(tr.raw==='rerecord') attention.push({tag:'Re-record',cls:'alert',title:tr.title,sub:loc+'  ·  flagged for re-record'});
      if(tr.cleaned && !a.cleanedApproved) awaitingClient++;
      if(tr.final && !a.finalApproved) awaitingClient++;
      if(tr.art && !a.artApproved) awaitingClient++;
      [['cleaned','Vocal'],['music','Music'],['final','Final'],['art','Cover']].forEach(function(p){
        var n=a[p[0]+'Note']; if(n) attention.push({tag:'Change',cls:'note',title:tr.title,sub:'['+p[1]+']  '+n});
      });
    });
    var cards=[['Pieces',total,''],['Awaiting you',rawToAccept,'attn'],['Awaiting client',awaitingClient,''],['Final approved',finalApproved,''],['Covers approved',coversApproved,'']];
    var ch='<div class="dash-cards">';
    cards.forEach(function(c){ ch+='<div class="dash-card '+c[2]+'"><div class="dc-num">'+c[1]+'</div><div class="dc-lbl">'+c[0]+'</div></div>'; });
    ch+='</div>';
    var at='<div class="dash-sec"><h3>Needs your attention</h3><div class="sec-note">Raw recordings to approve, re-records, and every change the client has requested.</div>';
    if(attention.length) attention.forEach(function(it){ at+='<div class="dash-item"><span class="di-tag '+it.cls+'">'+esc(it.tag)+'</span><div class="di-body"><div class="di-title">'+esc(it.title)+'</div><div class="di-sub">'+esc(it.sub)+'</div></div></div>'; });
    else at+='<div class="dash-empty">Nothing waiting on you. Everything is with the client or complete.</div>';
    at+='</div>';
    var wrap=document.createElement('div');wrap.innerHTML=ch+at;
    host.appendChild(wrap);
  }

  // ---- admin content-editor controls ----
  function addTrackControl(ci, si){
    var wrap=document.createElement('div');wrap.className='admin-add';
    var btn=document.createElement('button');btn.className='add-btn';btn.textContent='+ Add piece';
    wrap.appendChild(btn);
    btn.addEventListener('click',function(){
      if(wrap.querySelector('.add-form')) return;
      var form=document.createElement('div');form.className='add-form';
      form.innerHTML='<input class="title" placeholder="Piece title" />'
        +'<button class="mini-btn" data-save>Add</button><button class="mini-btn ghost" data-cancel>Cancel</button>';
      wrap.appendChild(form);
      var ti=form.querySelector('.title'); ti.focus();
      form.querySelector('[data-cancel]').addEventListener('click',function(){ form.remove(); });

  // reusable upload control (used for the Raw stage — client submits their recording)

  function addNav(label,filter,isSub,count){
    var b=document.createElement('button');
    b.className='nav-item'+(isSub?' sub':'')+(FILTER===filter?' active':'');
    b.innerHTML=esc(label)+(count!=null?'<span class="n-count">'+count+'</span>':'');
    b.addEventListener('click',function(){ FILTER=filter; render(); window.scrollTo({top:0,behavior:'smooth'}); });

  function listEl(tracks){ var l=document.createElement('div');l.className='list'; tracks.forEach(function(tr){ l.appendChild(trackEl(tr)); }); return l; }

  function trackEl(tr){
    var wrap=document.createElement('div');wrap.className='track'+(appr(tr.id).finalApproved?' complete':'')+(openIds[tr.id]?' open':'');
    var st=steps(tr), lab=statusLabel(tr);
    function stepHtml(cls,label,num,tip){ return '<div class="step '+cls+(cls==='done'?' on-line':'')+'" title="'+esc(tip||'')+'"><div class="sdot">'+(cls==='done'?'✓':num)+'</div><div class="slabel">'+label+'</div></div>'; }
    var row=document.createElement('div');row.className='row';
    row.innerHTML='<div class="r-main"><div class="r-title">'+esc(tr.title)+'</div><div class="r-status '+lab[1]+'">'+lab[0]+'</div></div>'
      +'<div class="tracker">'
        +stepHtml(st.raw,'Vocal',1,"Your raw recording is in. Craig confirms it's good to produce, or flags a re-record.")
        +stepHtml(st.cleaned,'Produced',2,"Craig's cleaned, produced version of your vocal. Approve it or request a change.")
        +stepHtml(st.music,'Music',3,"Your vocal set to music — up to three options, pick the one you love.")
        +stepHtml(st.art,'Cover',4,"Your cover artwork — upload your own or approve the studio-created design.")
        +stepHtml(st.final,'Final',5,"The finished master. Approve it and complete your purchase.")
      +'</div><div class="chev">▶</div>';
    var expand=document.createElement('div');expand.className='expand';
    wrap.appendChild(row);wrap.appendChild(expand);
    var built=openIds[tr.id]; if(built) buildExpand(tr,expand);
    row.addEventListener('click',function(){
      if(!expand.innerHTML) buildExpand(tr,expand);
      var open=wrap.classList.toggle('open'); openIds[tr.id]=open?1:0;
    });
    return wrap;
  }

  function stageEl(num,name,chipCls,chipText,tip){
    var el=document.createElement('div');el.className='stage';
    el.innerHTML='<div class="stage-head"><div class="stage-num">'+num+'</div><div class="stage-name" title="'+esc(tip||'')+'">'+esc(name)+(tip?' <span class="stage-info" title="'+esc(tip)+'">ⓘ</span>':'')+'</div><div class="stage-chip '+chipCls+'">'+chipText+'</div></div>';
    return el;
  }
  function audioHtml(f){ return f?'<audio controls preload="none" src="audio/'+encodeURIComponent(f)+'"></audio>':'<div class="no-audio">No preview uploaded yet.</div>'; }

  function buildExpand(tr,expand){
    expand.innerHTML='';
    var a=appr(tr.id);

    if(vr()==='admin') expand.appendChild(detailsEditor(tr));

    // client-visible description
    if(tr.description){
      var dsc=document.createElement('div');dsc.className='piece-desc';
      dsc.innerHTML='<div class="pd-lbl">About this piece</div>'+esc(tr.description);
      expand.appendChild(dsc);
    }

    // Stage 1 — Vocal Received
    var rawChip=tr.raw==='accepted'?['done','Approved']:(tr.raw==='rerecord'?['alert','Re-record']:['lock','Received']);
    var s1=stageEl('1','Vocal Received',rawChip[0],rawChip[1],"Your raw recording is in. Craig approves the recording quality so it can go into production, or flags a re-record.");
    if(tr.raw==='rerecord') s1.insertAdjacentHTML('beforeend','<div class="rerecord-banner">This recording needs to be re-recorded. Please record again and upload it below.</div>');
    else {
      var rawMsg = tr.raw==='accepted' ? 'Recording is in and approved for production.'
                 : (vr()==='client' ? 'Upload your recording here so it can go into production.' : 'Recording is in, awaiting your review.');
      s1.insertAdjacentHTML('beforeend','<div class="stage-body">'+rawMsg+'</div>');
    }
    if(tr.audio && tr.audio.raw) s1.insertAdjacentHTML('beforeend', audioHtml(tr.audio.raw));
    s1.appendChild(uploadRow(tr,'raw', vr()==='client' ? (tr.raw==='rerecord'?'Re-record and upload':'Upload your recording') : "Upload raw recording (on client's behalf)"));
    if(vr()==='admin'){
      var ab=document.createElement('div');ab.className='admin-box';
      ab.innerHTML='<div class="lbl">Admin</div>'
        +'<div class="admin-row">Vocal status: '
        +'<select data-raw title="Your quality gate. Received = uploaded, awaiting your check. Approved = quality is good, into production. Needs re-record = not usable, back to the client.">'
        +'<option value="received" title="Uploaded — awaiting your quality check">Received — awaiting your check</option>'
        +'<option value="accepted" title="Quality is good — send it into production">Approved — good to produce</option>'
        +'<option value="rerecord" title="Not usable — send it back to the client to record again">Needs re-record</option>'
        +'</select></div>'
        +'<div style="margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.45">Your quality gate: mark <b>Approved</b> once the recording sounds good to produce. Wording is the client\'s call — they sign off by uploading, and confirm it again at the Final stage.</div>';
      ab.querySelector('[data-raw]').value=tr.raw;
      ab.querySelector('[data-raw]').addEventListener('change',function(){ api('POST','/api/track/'+tr.id,{raw:this.value}).then(reloadKeepOpen); });
      s1.appendChild(ab);
    }
    expand.appendChild(s1);

    // Stages 2–5 (Cover Art now sits before Final Production)
    expand.appendChild(clientStage(tr,'2','Produced Vocal','cleaned','Listen and approve the produced vocal, or ask for a fix.','Craig produces the vocal here once the recording is approved.',"Craig's cleaned, produced version of your vocal. Approve it or request a change."));
    expand.appendChild(musicSamplesStage(tr,'3'));
    expand.appendChild(artStage(tr,'4'));
    expand.appendChild(finalStage(tr,'5'));
    var pb=payBlock(tr); if(pb) expand.appendChild(pb);
  }

  // Approve & Pay — client sees a grayed button once the Final master is ready; it activates on approval.
  function payBlock(tr){
    var a=appr(tr.id), payUrl=D.project.payUrl, payLabel=D.project.payLabel||'';
    if(vr()==='client'){
      if(!tr.final) return null;                 // only once the final master is released
      var approved=!!a.finalApproved;
      var el=document.createElement('div');el.className='pay-block';
      var h='<div class="pay-lbl">'+(approved?'You have approved the final master.':'Approve the final master above to complete your purchase.')+(payLabel?' <b>'+esc(payLabel)+'</b>':'')+'</div>';
      if(approved && payUrl){
        h+='<a class="pay-btn" href="'+esc(payUrl)+'" target="_blank" rel="noopener">Approve &amp; Pay</a>';
      }else if(approved && !payUrl){
        h+='<span class="pay-btn disabled">Approve &amp; Pay</span><div class="pay-note">Payment link is being finalised.</div>';
      }else{
        h+='<span class="pay-btn disabled">Approve &amp; Pay</span><div class="pay-note">Available once you approve the final master above.</div>';
      }
      el.innerHTML=h; return el;
    }
    if(vr()==='admin' && tr.final){
      var el2=document.createElement('div');el2.className='pay-block';
      el2.innerHTML='<div class="pay-lbl">Payment — shown to the client once they approve the final.</div>'
        +(payUrl?'<div class="pay-note">Pay link set'+(payLabel?' · '+esc(payLabel):'')+'. Change it in <b>Settings</b>.</div>'
                :'<div class="pay-note">No pay link yet — add your Stripe link in <b>Settings</b> so Approve &amp; Pay works.</div>');
      return el2;
    }
    return null;
  }

      upBtn.addEventListener('click',function(){
        if(!fileInput.files||!fileInput.files[0]) return;

          .catch(function(){ upBtn.disabled=false;upBtn.textContent='Upload cover'; alert('Upload failed'); });

  function clientStage(tr,num,name,stage,readyHint,lockHint,tip){
    var a=appr(tr.id), ready=!!tr[stage], file=tr.audio[stage];
    var isApproveStage=(stage==='cleaned'||stage==='final');
    var approvedKey=stage==='cleaned'?'cleanedApproved':'finalApproved';
    var approved=!!a[approvedKey];
    var chip = !ready?['lock','In progress']:(stage==='music'?(a.musicSeen?['done','Previewed']:['await','Ready to preview']):(approved?['done','Approved']:['await','Awaiting client']));
    var el=stageEl(num,name,chip[0],chip[1],tip);

    if(ready){
      el.insertAdjacentHTML('beforeend',audioHtml(file));
      if(vr()==='client'){
        var actions=document.createElement('div');actions.className='stage-actions';
        var approveHandler;
        if(isApproveStage){
          actions.innerHTML='<button class="approve-btn'+(approved?' on':'')+'">'+(approved?'Approved ✓':'Approve')+'</button><button class="note-toggle">Request a change</button>';
          approveHandler=function(){ api('POST','/api/approve',{trackId:tr.id,stage:stage,approved:!approved}).then(reloadKeepOpen); };
        }else{ // music
          actions.innerHTML='<button class="approve-btn'+(a.musicSeen?' on':'')+'">'+(a.musicSeen?'Music looks good ✓':'Mark music as previewed')+'</button><button class="note-toggle">Add a note on the music</button>';
          approveHandler=function(){ api('POST','/api/music-seen',{trackId:tr.id,seen:!a.musicSeen}).then(reloadKeepOpen); };
        }
        el.appendChild(actions);
        var nb=document.createElement('textarea');nb.className='note-box'+((a[stage+'Note'])?' open':'');nb.placeholder='What would you like changed?';nb.value=a[stage+'Note']||'';
        el.appendChild(nb);
        actions.querySelector('.note-toggle').addEventListener('click',function(){ nb.classList.toggle('open'); if(nb.classList.contains('open')) nb.focus(); });
        if(!PREVIEW){
          actions.querySelector('.approve-btn').addEventListener('click',approveHandler);
          nb.addEventListener('change',function(){ api('POST','/api/note',{trackId:tr.id,stage:stage,note:nb.value.trim()}).then(function(){ a[stage+'Note']=nb.value.trim(); refreshBar(); }); });
        }else{ var pbtn=actions.querySelector('.approve-btn'); pbtn.disabled=true; pbtn.title='Read-only preview — log in with the client code to approve'; nb.readOnly=true; nb.title='Read-only preview'; }
      }else{

      el.insertAdjacentHTML('beforeend','<div class="stage-body">'+lockHint+'</div>');

        +'<div class="admin-row"><input type="file" accept="audio/*" data-file><button class="mini-btn" data-up>Upload</button><span class="uling" data-cur>'+(file?('current: '+esc(file)):'no file yet')+'</span></div>'
        +'<div class="admin-row"><label class="toggle-lbl"><input type="checkbox" data-ready '+(ready?'checked':'')+'> Ready for client to review</label></div>';
      var fileInput=ab.querySelector('[data-file]'), upBtn=ab.querySelector('[data-up]'), readyCb=ab.querySelector('[data-ready]');
      upBtn.addEventListener('click',function(){

        upBtn.disabled=true;upBtn.textContent='Uploading…';
        var fd=new FormData();fd.append('file',fileInput.files[0]);fd.append('trackId',tr.id);fd.append('stage',stage);
        fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(){ reloadKeepOpen(); })
          .catch(function(){ upBtn.disabled=false;upBtn.textContent='Upload'; alert('Upload failed'); });
      });
      readyCb.addEventListener('change',function(){ var patch={};patch[stage]=readyCb.checked; api('POST','/api/track/'+tr.id,patch).then(reloadKeepOpen); });
      el.appendChild(ab);
    }

  // Stage 3 — Music Samples: up to 3 vocal+music options, one recommended; client picks one.

        box.innerHTML='<div class="sample-head">Option '+(i+1)
          +(i===rec?' <span class="sample-rec">Recommended</span>':'')

          +'</div>'+audioHtml(f);

        el.appendChild(nb);
        actions.querySelector('.note-toggle').addEventListener('click',function(){ nb.classList.toggle('open'); if(nb.classList.contains('open')) nb.focus(); });
        if(!PREVIEW){ nb.addEventListener('change',function(){ api('POST','/api/note',{trackId:tr.id,stage:'music',note:nb.value.trim()}).then(function(){ a.musicNote=nb.value.trim(); refreshBar(); }); }); }

          +'<input type="file" accept="audio/*" data-file="'+i+'"><button class="mini-btn" data-up="'+i+'">Upload</button>'
          +'<span class="uling">'+(cur?('current: '+esc(cur)):'no file')+'</span>';
        ab.appendChild(row);
      });
      var readyRow=document.createElement('div');readyRow.className='admin-row';
      readyRow.innerHTML='<label class="toggle-lbl"><input type="checkbox" data-ready '+(ready?'checked':'')+'> Ready for client to review</label>';
      ab.appendChild(readyRow);
      ab.querySelectorAll('[data-rec]').forEach(function(r){ r.addEventListener('change',function(){ if(r.checked) api('POST','/api/track/'+tr.id,{recommended:parseInt(r.getAttribute('data-rec'),10)}).then(reloadKeepOpen); }); });
      ab.querySelectorAll('[data-up]').forEach(function(btn){
        btn.addEventListener('click',function(){
          var i=btn.getAttribute('data-up'), fi=ab.querySelector('[data-file="'+i+'"]');
          if(!fi.files||!fi.files[0]) return;
          btn.disabled=true;btn.textContent='Uploading…';
          var fd=new FormData();fd.append('file',fi.files[0]);fd.append('trackId',tr.id);fd.append('stage','music');fd.append('sampleIndex',i);
          fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(j){ if(j.error) throw j; reloadKeepOpen(); })
            .catch(function(){ btn.disabled=false;btn.textContent='Upload'; alert('Upload failed'); });
        });
      });
      ab.querySelector('[data-ready]').addEventListener('change',function(){ api('POST','/api/track/'+tr.id,{music:this.checked}).then(reloadKeepOpen); });
      el.appendChild(ab);
    }
    return el;
  }

  // Stage 5 — Final Production: dual approval (levels + wording) + client metadata; pay unlocks when both approved.
  function finalStage(tr,num){
    var a=appr(tr.id), ready=!!tr.final, file=tr.audio.final;
    var levels=!!a.levelsApproved, wording=!!a.wordingApproved, approved=levels&&wording;
    var chip = !ready?['lock','In progress']:(approved?['done','Approved']:['await','Awaiting client']);
    var el=stageEl(num,'Final Production',chip[0],chip[1],"The finished master. Approve the levels and the wording, add your metadata, then complete your purchase.");

    if(ready){
      el.insertAdjacentHTML('beforeend',audioHtml(file));
      if(vr()==='client'){
        var dual=document.createElement('div');dual.className='dual-approve';
        dual.innerHTML='<button class="approve-btn'+(levels?' on':'')+'" data-lev>'+(levels?'Levels approved ✓':'Approve levels')+'</button>'
          +'<button class="approve-btn'+(wording?' on':'')+'" data-word>'+(wording?'Wording approved ✓':'Approve wording')+'</button>'
          +'<button class="note-toggle" data-notet>Request a change</button>';
        el.appendChild(dual);
        var nb=document.createElement('textarea');nb.className='note-box'+((a.finalNote)?' open':'');nb.placeholder='What would you like changed?';nb.value=a.finalNote||'';
        el.appendChild(nb);
        var m=a.metadata||{};
        el.insertAdjacentHTML('beforeend','<div class="uling" style="margin-top:10px">Your track details (carried into the finished file):</div>');
        var mf=document.createElement('div');mf.className='meta-form';
        mf.innerHTML='<input class="full" data-m="title" placeholder="Title" value="'+esc(m.title||'')+'">'
          +'<input data-m="artist" placeholder="Artist" value="'+esc(m.artist||'')+'">'
          +'<input data-m="album" placeholder="Album / collection" value="'+esc(m.album||'')+'">'
          +'<input data-m="genre" placeholder="Genre" value="'+esc(m.genre||'')+'">'
          +'<input data-m="year" placeholder="Year" value="'+esc(m.year||'')+'">'
          +'<button class="mini-btn full" data-msave style="justify-self:start">Save metadata</button>';
        el.appendChild(mf);
        dual.querySelector('[data-notet]').addEventListener('click',function(){ nb.classList.toggle('open'); if(nb.classList.contains('open')) nb.focus(); });
        if(!PREVIEW){
          dual.querySelector('[data-lev]').addEventListener('click',function(){ api('POST','/api/approve',{trackId:tr.id,stage:'levels',approved:!levels}).then(reloadKeepOpen); });
          dual.querySelector('[data-word]').addEventListener('click',function(){ api('POST','/api/approve',{trackId:tr.id,stage:'wording',approved:!wording}).then(reloadKeepOpen); });
          nb.addEventListener('change',function(){ api('POST','/api/note',{trackId:tr.id,stage:'final',note:nb.value.trim()}).then(function(){ a.finalNote=nb.value.trim(); refreshBar(); }); });
          mf.querySelector('[data-msave]').addEventListener('click',function(){
            var md={}; mf.querySelectorAll('[data-m]').forEach(function(inp){ md[inp.getAttribute('data-m')]=inp.value.trim(); });
            var btn=mf.querySelector('[data-msave]'); btn.disabled=true; btn.textContent='Saving…';
            api('POST','/api/metadata',{trackId:tr.id,metadata:md}).then(function(){ a.metadata=md; btn.textContent='Saved ✓'; setTimeout(function(){ btn.disabled=false; btn.textContent='Save metadata'; },1600); })
              .catch(function(){ btn.disabled=false; btn.textContent='Save metadata'; alert('Save failed'); });
          });
        } else {
          dual.querySelectorAll('button').forEach(function(b){ b.disabled=true; });
          nb.readOnly=true; mf.querySelectorAll('input,button').forEach(function(x){ x.disabled=true; });
        }
      } else {
        el.insertAdjacentHTML('beforeend','<div class="uling" style="margin-top:8px">Client approvals — levels '+(levels?'✓':'—')+' · wording '+(wording?'✓':'—')+'</div>');
        var m2=a.metadata||{};
        if(m2.title||m2.artist||m2.album||m2.genre||m2.year){
          el.insertAdjacentHTML('beforeend','<div class="meta-view"><b>Client metadata:</b> '+esc([m2.title,m2.artist,m2.album,m2.genre,m2.year].filter(Boolean).join(' · '))+'</div>');
        }
        if(a.finalNote) el.insertAdjacentHTML('beforeend','<div class="client-note-view"><b>Client note:</b> '+esc(a.finalNote)+'</div>');
      }
    } else {
      el.insertAdjacentHTML('beforeend','<div class="stage-body">The final production comes together after you choose your music.</div>');
    }

    if(vr()==='admin'){
      var ab=document.createElement('div');ab.className='admin-box';
      ab.innerHTML='<div class="lbl">Admin — Final Production</div>'
        +'<div class="admin-row"><input type="file" accept="audio/*" data-file><button class="mini-btn" data-up>Upload</button><span class="uling">'+(file?('current: '+esc(file)):'no file yet')+'</span></div>'
        +'<div class="admin-row"><label class="toggle-lbl"><input type="checkbox" data-ready '+(ready?'checked':'')+'> Ready for client to review</label></div>';
      var fileInput=ab.querySelector('[data-file]'), upBtn=ab.querySelector('[data-up]'), readyCb=ab.querySelector('[data-ready]');
      upBtn.addEventListener('click',function(){
        if(!fileInput.files||!fileInput.files[0]) return;
        upBtn.disabled=true;upBtn.textContent='Uploading…';
        var fd=new FormData();fd.append('file',fileInput.files[0]);fd.append('trackId',tr.id);fd.append('stage','final');
        fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(){ reloadKeepOpen(); })
          .catch(function(){ upBtn.disabled=false;upBtn.textContent='Upload'; alert('Upload failed'); });
      });
      readyCb.addEventListener('change',function(){ api('POST','/api/track/'+tr.id,{final:readyCb.checked}).then(reloadKeepOpen); });
      el.appendChild(ab);
    }
    return el;
  }

  function reloadKeepOpen(){ return api('GET','/api/data').then(function(data){ D=data; applyProjectChrome(); render(); refreshBar(); }); }

  function refreshBar(){
    var fin=0,voc=0,cov=0,notes=0,total=0;
    allTracks().forEach(function(x){ total++; var a=appr(x.t.id); if(a.finalApproved)fin++; if(a.cleanedApproved)voc++; if(a.artApproved)cov++; if(a.cleanedNote||a.finalNote||a.musicNote||a.artNote)notes++; });
    document.getElementById('barStat').innerHTML='<b>'+fin+'</b> finalized · <b>'+voc+'</b> vocals approved · <b>'+cov+'</b> covers approved · <b>'+notes+'</b> with notes';
    var pct=total?Math.round(fin/total*100):0;
    document.getElementById('sideProgress').innerHTML='<b>'+fin+'</b> of '+total+' finalized<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>';
  }

  document.getElementById('copyBtn').addEventListener('click',function(){
    var lines=[D.project.name+' — my review','('+D.client.name+')',''],fin=[],voc=[],cov=[],notes=[];
    allTracks().forEach(function(x){
      var a=appr(x.t.id),loc=x.sub?x.cat+' / '+x.sub:x.cat,ttl=x.t.title;
      if(a.finalApproved)fin.push('✓ '+ttl+' ('+loc+')'); else if(a.cleanedApproved)voc.push('• '+ttl+' — vocal approved ('+loc+')');
      if(a.artApproved)cov.push('✓ '+ttl+' ('+loc+')');
      if(a.cleanedNote)notes.push('• '+ttl+' [vocal]: '+a.cleanedNote);
      if(a.musicNote)notes.push('• '+ttl+' [music]: '+a.musicNote);
      if(a.finalNote)notes.push('• '+ttl+' [final]: '+a.finalNote);
      if(a.artNote)notes.push('• '+ttl+' [cover]: '+a.artNote);
    });
    lines.push('FINAL APPROVED ('+fin.length+'):');lines=lines.concat(fin.length?fin:['(none yet)']);
    lines.push('','VOCAL APPROVED, awaiting final ('+voc.length+'):');lines=lines.concat(voc.length?voc:['(none)']);
    lines.push('','COVER ART APPROVED ('+cov.length+'):');lines=lines.concat(cov.length?cov:['(none)']);
    lines.push('','NOTES / CHANGES ('+notes.length+'):');lines=lines.concat(notes.length?notes:['(none)']);
    var text=lines.join('\n'),btn=this,method=(D.contact&&D.contact.method)||'WhatsApp';
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){flash(btn,method);},function(){fb(text,btn,method);}); else fb(text,btn,method);
  });
  function flash(btn,m){var o=btn.textContent;btn.textContent='Copied ✓ — paste into '+m;btn.classList.add('done');setTimeout(function(){btn.textContent=o;btn.classList.remove('done');},2600);}
  function fb(text,btn,m){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash(btn,m);}catch(e){alert(text);}document.body.removeChild(ta);}

  // ---- start: check session
  api('GET','/api/me').then(function(m){ if(m.role) boot(); else { loginWrap.style.display='flex'; } })
    .catch(function(){ loginWrap.style.display='flex'; });
})();
</script>
